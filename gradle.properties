# Project-wide Gradle properties.
# See https://docs.gradle.org/current/userguide/build_environment.html

# JVM heap for Gradle (fixes OutOfMemoryError during dex merge). Use 2g if 4g is too much for your machine.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true

# AndroidX: required when using AndroidX dependencies (Compose, Hilt, etc.)
android.useAndroidX=true

# Uncomment and set to your machine IP when the emulator cannot reach 10.0.2.2
# (e.g. physical device, or different network). Find IP: ifconfig (Mac/Linux) or ipconfig (Windows).
#API_BASE_URL=http://10.212.13.175:3000/api/v1/
#API_BASE_URL=http://10.64.42.175:3000/api/v1/
API_BASE_URL=https://safekart-app.vercel.app/api/v1/
